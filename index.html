<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar Noob</title>
<style>
  :root { --bg:#15161a; --panel:#1f2026; --line:#3a3c46; --text:#e8e8ee; --muted:#8a8c98; --accent:#e0523c; --ok:#4caf7a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); padding:16px; max-width:760px; margin-inline:auto; }
  h1 { font-size:1.4rem; margin:0 0 12px; }
  h2 { font-size:1.05rem; margin:0 0 10px; color:var(--accent); }
  section { background:var(--panel); border-radius:12px; padding:14px; margin-bottom:16px; }
  button { background:#2a2c35; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; font-size:0.9rem; }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:0.5; cursor:default; }
  input, select { background:#15161a; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:0.9rem; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .muted { color:var(--muted); font-size:0.85rem; }
  .ex { display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .ex:last-child { border-bottom:none; }
  .ex input[type=checkbox] { width:18px; height:18px; accent-color:var(--ok); }
  .ex.done span.txt { text-decoration:line-through; color:var(--muted); }
  .bar { height:8px; background:#2a2c35; border-radius:4px; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; background:var(--ok); width:0; transition:width 0.3s; }
  .beat { width:22px; height:22px; border-radius:50%; background:#2a2c35; border:1px solid var(--line); }
  .beat.on { background:var(--accent); }
  .beat.first.on { background:var(--ok); }
  .dot { transition: all 0.35s ease; }
  @keyframes pulse { 0%,100% { r:14; opacity:1; } 50% { r:18; opacity:0.6; } }
  .pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes press {
    0%   { transform: translateY(-14px) scale(1.25); }
    70%  { transform: translateY(2px) scale(0.95); }
    100% { transform: translateY(0) scale(1); }
  }
  .press { animation: press 0.45s ease-out; transform-box: fill-box; transform-origin: center; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guitar Noob">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js"); }
</script>
</head>
<body>

<div class="row" style="justify-content:space-between;margin-bottom:8px">
  <h1 id="title"></h1>
  <select id="langSelect" aria-label="Language">
    <option value="ro">Română</option>
    <option value="en">English</option>
    <option value="no">Norsk</option>
  </select>
</div>

<!-- GRIFUL -->
<section>
  <h2 id="t_fret"></h2>
  <div class="row" style="margin-bottom:10px">
    <select id="chordSelect"></select>
    <button id="playChordBtn"></button>
    <button id="demoBtn"></button>
    <span class="muted" id="chordInfo"></span>
  </div>
  <svg id="fretboard" viewBox="0 0 600 260" style="width:100%;height:auto;display:block"></svg>
  <p class="muted" style="margin:10px 0 2px">Mâna, de sus (schemă): 1 = index, 2 = mijlociu, 3 = inelar, 4 = mic</p>
  <svg id="handSvg" viewBox="0 0 600 150" style="width:100%;height:auto;display:block"></svg>
  <p id="handTip" style="margin:8px 0 0;font-size:0.95rem"></p>
  <p class="muted" id="t_fretHelp" style="margin:8px 0 0"></p>
</section>

<!-- VERIFICARE -->
<section>
  <h2 id="t_check"></h2>
  <div class="row" style="margin-bottom:8px">
    <button id="micBtn"></button>
    <span id="inputIndicator" class="muted" style="display:inline-flex;align-items:center;gap:6px">
      <span id="inputDot" style="width:10px;height:10px;border-radius:50%;background:#3a3c46;display:inline-block"></span>
      <span id="inputText"></span>
    </span>
    <span class="muted"><span id="t_target"></span> <b id="targetName"></b></span>
  </div>
  <div id="bars" style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:90px;align-items:end"></div>
  <div id="barLabels" class="muted" style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;text-align:center"></div>
  <p id="status" style="margin:10px 0 0;font-weight:600;min-height:1.4em"></p>
  <p class="muted" id="t_checkNote" style="margin:6px 0 0"></p>
</section>

<!-- METRONOM -->
<section>
  <h2 id="t_metro"></h2>
  <div class="row">
    <button id="metroToggle"></button>
    <label class="muted"><span id="t_bpm"></span>
      <input type="number" id="bpm" value="60" min="30" max="220" style="width:80px">
    </label>
    <div class="row" id="beats"></div>
  </div>
  <p class="muted" id="t_metroNote"></p>
</section>

<!-- TRASEU -->
<section>
  <h2 id="t_path"></h2>
  <div class="bar"><div id="progressBar"></div></div>
  <p class="muted" id="progressText" style="margin:0 0 8px"></p>
  <div id="exercises"></div>
  <div class="row" style="margin-top:12px">
    <button id="exportBtn"></button>
    <button id="importBtn"></button>
    <button id="resetBtn"></button>
  </div>
</section>

<!-- RITMUL TAU -->
<section>
  <h2>Ritmul tău</h2>
  <p class="muted" style="margin-top:0">Unu, doi, trei, patru, unu, trei, patru, la 60 BPM. E5 cade pe fiecare bătaie din ritm, tăcere pe bătaia a șasea.</p>
  <div class="row">
    <button id="patternBtn">Arată ritmul</button>
    <span class="muted" id="patternInfo"></span>
  </div>
</section>

<!-- SESIUNI -->
<section>
  <h2 id="t_sessions"></h2>
  <div id="sessions"></div>
</section>

<!-- PIESE PROPRII -->
<section>
  <h2 id="t_songs"></h2>
  <p class="muted" id="t_songsNote" style="margin-top:0"></p>
  <div class="row" style="margin-bottom:8px">
    <input id="songName" style="flex:1;min-width:140px">
  </div>
  <div class="row" style="margin-bottom:8px">
    <input id="songChords" style="flex:1;min-width:200px">
    <button id="saveSongBtn"></button>
  </div>
  <div id="songList"></div>
</section>

    micErr: "Kan ikke få tilgang til mikrofonen. Kjør via en lokal server og tillat mikrofon i nettleseren.",
    stages: ["Trinn 1: power chords", "Trinn 2: palm muting", "Trinn 3: åpne akkorder", "Trinn 4: enkle riff", "Kapittel 5: rytme og tempo", "Kapittel 6: mer komplekse progresjoner"],
    items: [
      ["E5, 4 slag hver, 60 BPM", "E5"], ["A5, 4 slag hver, 60 BPM", "A5"], ["E5 A5 D5 G5 uten stopp, 60 BPM", null], ["Samme øvelse på 80 BPM", null],
      ["E5 med palm muting, kort lyd", "E5"], ["Veksle mellom dempet og åpen på samme tone", null], ["8-slags riff med palm muting, 70 BPM", null],
      ["Em, Am, E, A, 4 slag hver", null], ["D, Dm, G, C, 4 slag hver", null], ["Bytt mellom to akkorder på under ett sekund", null],
      ["E5-riff med åtte slag, 70 BPM", null], ["Din låt lagt inn manuelt, første 8 takter", null],
      ["E5 i 8 slag, vekslende palm muting og åpen lyd, 90 BPM", null], ["E5 A5 E5 D5, 4 slag hver, 90 BPM", null], ["G5 D5 A5 E5, 4 slag hver, 100 BPM", null],
      ["Am, Em, G, C, 4 slag hver, 80 BPM", null], ["E, A, D, E, 4 slag hver, 90 BPM", null], ["16-slags riff med palm muting, E5 A5 E5 D5, 110 BPM", null]
    ]
  }
};

let LANG = localStorage.getItem("gt-lang") || "ro";
const t = (key, vars = {}) => {
  let s = (T[LANG][key] ?? T.ro[key] ?? key);
  for (const k in vars) s = s.replace(`{${k}}`, vars[k]);
  return s;
};

/* ---------- ACORDURI ---------- */
// Ordinea corzilor: E grava, A, D, G, B, E subțire. null = corda nu se cântă.
const CHORDS = {
  "E5":  { frets:[0,2,2,null,null,null],   fingers:[null,1,1,null,null,null] },
  "A5":  { frets:[null,0,2,2,null,null],   fingers:[null,null,1,1,null,null] },
  "D5":  { frets:[null,null,0,2,3,null],   fingers:[null,null,null,1,2,null] },
  "G5":  { frets:[3,5,5,null,null,null],   fingers:[1,3,4,null,null,null] },
  "E":   { frets:[0,2,2,1,0,0],            fingers:[null,2,3,1,null,null] },
  "Em":  { frets:[0,2,2,0,0,0],            fingers:[null,2,3,null,null,null] },
  "A":   { frets:[null,0,2,2,2,0],         fingers:[null,null,1,2,3,null] },
  "Am":  { frets:[null,0,2,2,1,0],         fingers:[null,null,2,3,1,null] },
  "D":   { frets:[null,null,0,2,3,2],      fingers:[null,null,null,1,3,2] },
  "Dm":  { frets:[null,null,0,2,3,1],      fingers:[null,null,null,2,3,1] },
  "G":   { frets:[3,2,0,0,0,3],            fingers:[3,2,null,null,null,4] },
  "C":   { frets:[null,3,2,0,1,0],         fingers:[null,3,2,null,1,null] }
};

/* ---------- GRIFUL ---------- */
const svg = document.getElementById("fretboard");
const NS = "http://www.w3.org/2000/svg";
const X0 = 60, X_GAP = 90, Y0 = 40, Y_GAP = 36, FRETS = 5;
const STR_X = i => X0 + i * X_GAP;
const FRET_Y = f => Y0 + f * Y_GAP;
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function drawBoard() {
  svg.innerHTML = "";
  el("rect", { x:STR_X(0)-8, y:Y0-6, width:STR_X(5)-STR_X(0)+16, height:8, fill:"#c9c9d1", rx:2 }, svg);
  for (let f = 1; f <= FRETS; f++) {
    el("line", { x1:STR_X(0)-8, x2:STR_X(5)+8, y1:FRET_Y(f), y2:FRET_Y(f), stroke:"#3a3c46", "stroke-width":2 }, svg);
    el("text", { x:STR_X(0)-30, y:FRET_Y(f-1)+Y_GAP/2+4, fill:"#8a8c98", "font-size":12, "text-anchor":"middle" }, svg).textContent = f;
  }
  const names = ["E","A","D","G","B","E"];
  for (let s = 0; s < 6; s++) {
    el("line", { x1:STR_X(s), x2:STR_X(s), y1:Y0-6, y2:FRET_Y(FRETS), stroke:"#8a8c98", "stroke-width":1+(5-s)*0.4 }, svg);
    el("text", { x:STR_X(s), y:24, fill:"#8a8c98", "font-size":12, "text-anchor":"middle" }, svg).textContent = names[s];
    el("text", { id:"mark"+s, x:STR_X(s), y:Y0-14, fill:"#4caf7a", "font-size":16, "text-anchor":"middle" }, svg);
  }
  for (let s = 0; s < 6; s++) {
    el("circle", { id:"dot"+s, class:"dot", cx:STR_X(s), cy:Y0, r:14, fill:"#e0523c", opacity:0 }, svg);
    el("text", { id:"fin"+s, x:STR_X(s), y:Y0+5, fill:"#fff", "font-size":13, "font-weight":"bold", "text-anchor":"middle", opacity:0 }, svg);
  }
}
function setDot(s, fret, finger) {
  const dot = document.getElementById("dot"+s), fin = document.getElementById("fin"+s);
  const cy = fret === 0 ? Y0 : FRET_Y(fret) - Y_GAP/2;
  dot.setAttribute("cx", STR_X(s)); dot.setAttribute("cy", cy); dot.setAttribute("r", 14);
  dot.setAttribute("opacity", 1); dot.setAttribute("class", "dot");
  fin.setAttribute("x", STR_X(s)); fin.setAttribute("y", cy+5); fin.setAttribute("opacity", 1);
  fin.textContent = finger ?? "";
}
function clearBoard() {
  for (let s = 0; s < 6; s++) {
    const d = document.getElementById("dot"+s);
    d.setAttribute("opacity", 0); d.setAttribute("class", "dot"); d.classList.remove("pulse");
    document.getElementById("fin"+s).setAttribute("opacity", 0);
    const mk = document.getElementById("mark"+s); mk.textContent = ""; 
  }
}
let currentChord = "E5", animTimer = null;
function showChord(name) {
  const c = CHORDS[name]; if (!c) return;
  currentChord = name; clearBoard();
  for (let s = 0; s < 6; s++) {
    const f = c.frets[s], mk = document.getElementById("mark"+s);
    if (f === null) { mk.textContent = "X"; mk.setAttribute("fill", "#8a8c98"); continue; }
    if (f === 0) { mk.textContent = "O"; mk.setAttribute("fill", "#4caf7a"); continue; }
    setDot(s, f, c.fingers[s]);
    document.getElementById("dot"+s).classList.add("pulse");
  }
  document.getElementById("chordInfo").textContent = `${name}: ${c.frets.map(f => f===null?"X":f).join(" ")}`;
  document.getElementById("targetName").textContent = name;
  document.getElementById("chordSelect").value = name;
  document.getElementById("handTip").textContent = handTip(name);
  updateHand(name);
}
/* ---------- SCHEMA MÂNEI ---------- */
const FINGER_COLORS = { 1: "#e0523c", 2: "#e88a3c", 3: "#4caf7a", 4: "#4a8fd8" };
const HY = f => f === 0 ? 18 : 18 + f * 22;          // rând pentru fiecare fret
function drawHand() {
  const h = document.getElementById("handSvg");
  h.innerHTML = "";
  for (let s = 0; s < 6; s++) el("line", { x1:STR_X(s), x2:STR_X(s), y1:18, y2:HY(5), stroke:"#3a3c46", "stroke-width":1.5 }, h);
  for (let f = 1; f <= 5; f++) el("line", { x1:STR_X(0)-8, x2:STR_X(5)+8, y1:HY(f), y2:HY(f), stroke:"#3a3c46", "stroke-width":1 }, h);
  for (let k = 1; k <= 4; k++) {
    const g = el("circle", { id:"hf"+k, r:12, fill:FINGER_COLORS[k], opacity:0 }, h);
    g.style.transition = "cx 0.4s ease, cy 0.4s ease, opacity 0.3s ease";
    const tx = el("text", { id:"hft"+k, "font-size":13, "font-weight":"bold", fill:"#fff", "text-anchor":"middle", opacity:0 }, h);
    tx.style.transition = "x 0.4s ease, y 0.4s ease, opacity 0.3s ease";
    tx.textContent = k;
  }

const OPEN_HZ = [82.41, 110.00, 146.83, 196.00, 246.94, 329.63];
const OPEN_PC = [4, 9, 2, 7, 11, 4];

function playDemo(chordName = currentChord) {
  const ctx = getCtx(), c = CHORDS[chordName], now = ctx.currentTime;
  c.frets.forEach((f, s) => {
    if (f === null) return;
    const t0 = now + s * 0.03;
    const osc = ctx.createOscillator(), filt = ctx.createBiquadFilter(), g = ctx.createGain();
    osc.type = "sawtooth"; osc.frequency.value = OPEN_HZ[s] * Math.pow(2, f/12);
    filt.type = "lowpass"; filt.frequency.value = 1800;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.12, t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t0+1.5);
    osc.connect(filt); filt.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+1.6);
  });
}

let micStream = null, micCtx = null, analyser = null, detectTimer = null;

function targetPCs(chord) {
  const set = new Set();
  CHORDS[chord].frets.forEach((f, s) => { if (f !== null) set.add((OPEN_PC[s] + f) % 12); });
  return set;
}
// Returns { level, ok, missing, wrong, norm } for the given chord, based on the current frame
function measure(chord) {
  const td = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(td);
  let rms = 0; for (const v of td) rms += v*v; rms = Math.sqrt(rms / td.length);
  if (rms < 0.01) return { level: false };
  const n = analyser.frequencyBinCount, db = new Float32Array(n);
  analyser.getFloatFrequencyData(db);
  const binHz = micCtx.sampleRate / analyser.fftSize;
  const chroma = new Array(12).fill(0);
  for (let k = 1; k < n; k++) {
    const f = k * binHz;
    if (f < 70 || f > 1200) continue;
    const pc = ((Math.round(12 * Math.log2(f/440)) + 69) % 12 + 12) % 12;
    const lin = Math.pow(10, db[k]/20); chroma[pc] += lin*lin;
  }
  const max = Math.max(...chroma) || 1;
  const norm = chroma.map(v => v / max);
  const exp = targetPCs(chord);
  const missing = [...exp].filter(pc => norm[pc] < 0.35);
  const wrong = [...Array(12).keys()].filter(pc => !exp.has(pc) && norm[pc] >= 0.75);
  return { level: true, ok: missing.length === 0 && wrong.length === 0, missing, wrong, norm, exp };
}

let okStreak = 0;
function analyse() {
  const status = document.getElementById("status");
  const m = measure(currentChord);
  setInputIndicator(m.level);
  drawSignal(m);
  if (!m.level) {
    okStreak = 0; barEls.forEach(b => b.style.height = "0%");
    status.textContent = t("noSound"); status.style.color = "var(--muted)"; return;
  }
  m.norm.forEach((v, pc) => {
    barEls[pc].style.height = Math.round(v*100) + "%";
    barEls[pc].style.background = m.exp.has(pc) ? "#4caf7a" : (m.wrong.includes(pc) ? "#e0523c" : "#3a3c46");
  });
  okStreak = m.ok ? okStreak + 1 : 0;
  if (okStreak >= 5) { status.textContent = t("correct", {c: currentChord}); status.style.color = "var(--ok)"; }
  else if (m.missing.length) { status.textContent = t("missing", {n: m.missing.map(p => PC_NAMES[p]).join(", ")}); status.style.color = "var(--accent)"; }
  else { status.textContent = t("extra", {n: m.wrong.map(p => PC_NAMES[p]).join(", ")}); status.style.color = "var(--accent)"; }
}

function setInputIndicator(active) {
  document.getElementById("inputDot").style.background = active ? "#4caf7a" : "#3a3c46";
  document.getElementById("inputText").textContent = active ? t("inputOn") : t("noInput");
}
async function startMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
    micCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = micCtx.createMediaStreamSource(micStream);
    analyser = micCtx.createAnalyser(); analyser.fftSize = 16384; analyser.smoothingTimeConstant = 0.5;
    src.connect(analyser);
    detectTimer = setInterval(analyse, 150);
    document.getElementById("micBtn").textContent = t("micOff");
  } catch (e) {
    const why = !navigator.mediaDevices ? "navigator.mediaDevices indisponibil (pagina nu e pe localhost sau HTTPS)" : `${e.name}: ${e.message}`;
    document.getElementById("status").textContent = t("micErr") + " (" + why + ")";
    document.getElementById("status").style.color = "var(--accent)";
    alert(t("micErr") + "\n\n" + why);
  }
}
function stopMic() {
  clearInterval(detectTimer); detectTimer = null;
  if (micStream) micStream.getTracks().forEach(tr => tr.stop());
  if (micCtx) micCtx.close();
  micStream = null; micCtx = null; analyser = null; okStreak = 0;
  barEls.forEach(b => b.style.height = "0%");
  document.getElementById("status").textContent = "";
  setInputIndicator(false);
  drawSignal({ level: false });
  document.getElementById("micBtn").textContent = t("mic");
}
document.getElementById("micBtn").addEventListener("click", () => { if (detectTimer) stopMic(); else startMic(); });

/* Semnalul primit de la chitară, afișat pe grif cu albastru: fiecare notă detectată apare
   pe toate pozițiile ei de pe grif (frete 0–5), cu intensitatea după volum */
function drawSignal(m) {
  let g = document.getElementById("sigGroup");
  if (!g) g = el("g", { id: "sigGroup" }, svg);
  while (g.firstChild) g.removeChild(g.firstChild);
  if (!m.level) return;
  for (let pc = 0; pc < 12; pc++) {
    if (m.norm[pc] < 0.35) continue;
    for (let s = 0; s < 6; s++) {
      const f = (pc - OPEN_PC[s] + 12) % 12;
      if (f > FRETS) continue;
      const cx = STR_X(s), cy = f === 0 ? Y0 : FRET_Y(f) - Y_GAP / 2;
      el("circle", { cx, cy, r: 7, fill: "#4a8fd8", opacity: (0.3 + 0.6 * m.norm[pc]).toFixed(2) }, g);
    }
  }
}

/* Verificare live a unui exercițiu: demo, apoi ascultare ~3 secunde */
async function verifyExercise(seq, btn, done) {
  if (!seq || !seq.length) return;
  if (!detectTimer) await startMic();
  if (!analyser) return;
  btn.disabled = true;
  let allPass = true;
  // Fiecare acord din secvență: demo, apoi ascultare ~3 secunde
  for (const chord of seq) {
    btn.textContent = t("verifying") + " " + chord;
    showChord(chord);
    playDemo(chord);
    await new Promise(r => setTimeout(r, 1500));
    let good = 0, total = 0;
    const end = Date.now() + 3000;
    while (Date.now() < end) {
      await new Promise(r => setTimeout(r, 150));
      const m = measure(chord); total++;
      if (m.level && m.ok) good++;
    }
    if (!(total > 0 && good / total >= 0.6)) allPass = false;
  }
  btn.disabled = false;
  btn.textContent = allPass ? t("verified") : t("notVerified");
  if (allPass) done();
}

/* Animația de la început, pentru fiecare acord din secvență: degetele se pun pe rând,
   cu sunetul demo și mâna actualizată, apoi trecem la următorul acord */
let seqTimer = null;
function playSequence(seq, bpm = null, beats = null) {
  clearTimeout(seqTimer);
  clearInterval(animTimer);
  // Ducem vizorul la griful, ca să vezi animația
  document.getElementById("fretboard").scrollIntoView({ behavior: "smooth", block: "center" });
  // Metronomul la tempo-ul exercițiului, ca să auzi ritmul
  if (bpm) {
    document.getElementById("bpm").value = bpm;
    if (metroTimer) toggleMetro();   // oprește ce rula
    toggleMetro();                   // pornește la noul tempo
  }
  // Ce trebuie să cânți: acorduri, bătăi, BPM
  const status = document.getElementById("status");
  status.style.color = "var(--muted)";
  status.textContent = `${seq.join(" → ")}${beats ? "  ·  " + beats + " bătăi" : ""}${bpm ? "  ·  " + bpm + " BPM" : ""}`;

  const period = bpm ? Math.round(4 * 60000 / bpm) : 4000;   // 4 bătăi pe acord
  // Repetă secvența până la 1 minut, ca să prinzi ritmul; un nou clic pe „Arată” o oprește și o repornește
  const LOOP_MS = 60000;
  const startedAt = Date.now();
  let i = 0;
  const step = () => {
    showChord(seq[i]);
    playDemo(seq[i]);
    playStepByStep();
    i++;
    if (i >= seq.length) {
      if (Date.now() - startedAt + period <= LOOP_MS) i = 0;        // mai facem o rundă
      else {                                                       // gata: oprim metronomul după ultimul acord
        if (bpm) seqTimer = setTimeout(() => { if (metroTimer) toggleMetro(); }, period);
        return;
      }
    }
    seqTimer = setTimeout(step, period);
  };
  step();
}

  const unknown = chords.filter(c => !CHORDS[c]);
  if (unknown.length) { alert(t("unknown", {u: unknown.join(", ")})); return; }
  songs.push({ name, chords });
  document.getElementById("songName").value = ""; document.getElementById("songChords").value = "";
  saveSongs();
});

/* ---------- SESIUNI ----------
   Fiecare sesiune folosește exerciții deja existente (cheile din SEQ / traseu).
   Sesiunea următoare se deschide după ce ai bifat încălzirea, tehnica și progresia. */
/* Tempo crescător: fiecare sesiune începe cu 5 BPM peste precedenta.
   Încălzire = tempo de bază, tehnică = +5, progresie = +10. */
const SESSIONS = [
  { warm: { desc: "E5 · 60 BPM", seq: ["E5"] },
    tech: { desc: "E5 · G5 · 65 BPM", seq: ["E5", "G5"] },
    prog: { desc: "E5 · E5 · G5 · A5 · 70 BPM", seq: ["E5", "E5", "G5", "A5"] } },
  { warm: { desc: "E5 · E5 · 65 BPM", seq: ["E5", "E5"] },
    tech: { desc: "E5 · E5 · G5 · A5 · 70 BPM", seq: ["E5", "E5", "G5", "A5"] },
    prog: { desc: "E5 · E5 · G5 · A5 · 75 BPM", seq: ["E5", "E5", "G5", "A5"] } },
  { warm: { desc: "E5 · A5 · 70 BPM", seq: ["E5", "A5"] },
    tech: { desc: "E5 · E5 · G5 · A5 · 75 BPM", seq: ["E5", "E5", "G5", "A5"] },
    prog: { desc: "E5 · E5 · G5 · A5 · 80 BPM", seq: ["E5", "E5", "G5", "A5"] } },
  { warm: { desc: "E5 · E5 · G5 · A5 · 75 BPM", seq: ["E5", "E5", "G5", "A5"] },
    tech: { desc: "E5 · E5 · G5 · A5 · D5 · 80 BPM", seq: ["E5", "E5", "G5", "A5", "D5"] },
    prog: { desc: "E5 · E5 · G5 · A5 · D5 · 85 BPM", seq: ["E5", "E5", "G5", "A5", "D5"] } },
  { warm: { desc: "A5 · E5 · 80 BPM", seq: ["A5", "E5"] },
    tech: { desc: "E5 · E5 · G5 · A5 · D5 · 85 BPM", seq: ["E5", "E5", "G5", "A5", "D5"] },
    prog: { desc: "E5 · E5 · G5 · A5 · D5 · 90 BPM", seq: ["E5", "E5", "G5", "A5", "D5"] } }
];
const SESS_LABELS = {
  ro: { title: "Sesiuni", session: "Sesiunea", warm: "Încălzire", tech: "Tehnică", prog: "Progresie", note: "Notă de final", notePh: "Ce a fost greu azi?", save: "Salvează", free: "Mod liber: deschide toate sesiunile", locked: "Termină sesiunea anterioară ca s-o deschizi.", done: "Sesiune completă" },
  en: { title: "Sessions", session: "Session", warm: "Warm-up", tech: "Technique", prog: "Progression", note: "End note", notePh: "What was hard today?", save: "Save", free: "Free mode: open all sessions", locked: "Finish the previous session to unlock it.", done: "Session complete" },
  no: { title: "Økter", session: "Økt", warm: "Oppvarming", tech: "Teknikk", prog: "Progresjon", note: "Sluttnotat", notePh: "Hva var vanskelig i dag?", save: "Lagre", free: "Fri modus: åpne alle økter", locked: "Fullfør forrige økt for å låse opp denne.", done: "Økt fullført" }
};
const SESS_STORE = "gt-sessions-v5";
let sessData = JSON.parse(localStorage.getItem(SESS_STORE) || "[]");
let FREE_MODE = localStorage.getItem("gt-free") === "1";

function persistSessions() { localStorage.setItem(SESS_STORE, JSON.stringify(sessData)); }

function renderSessions() {
  const L = SESS_LABELS[LANG] || SESS_LABELS.ro;
  document.getElementById("t_sessions").textContent = L.title;
  const root = document.getElementById("sessions"); root.innerHTML = "";
  const items = T[LANG].items;

  const fr = document.createElement("label");
  fr.className = "muted"; fr.style.display = "block"; fr.style.marginBottom = "8px";
  const fcb = document.createElement("input");
  fcb.type = "checkbox"; fcb.checked = FREE_MODE; fcb.style.marginRight = "6px";
  fcb.addEventListener("change", () => {
    FREE_MODE = fcb.checked;
    localStorage.setItem("gt-free", FREE_MODE ? "1" : "0");
    renderSessions();
  });
  fr.append(fcb, document.createTextNode(L.free));
  root.appendChild(fr);

  SESSIONS.forEach((s, i) => {
    sessData[i] = sessData[i] || {};
    const d = sessData[i];
    const complete = ["warm", "tech", "prog"].every(k => d[k]);
    d.done = complete;
    const prevDone = FREE_MODE || i === 0 || (sessData[i-1] && sessData[i-1].done);

    const head = document.createElement("div");
    head.className = "muted"; head.style.margin = "12px 0 4px";
    head.textContent = `${L.session} ${i+1}` + (complete ? " · " + L.done : "");
    root.appendChild(head);

    if (!prevDone) {
      const p = document.createElement("p"); p.className = "muted"; p.textContent = L.locked;
      root.appendChild(p); return;
    }

    ["warm", "tech", "prog"].forEach(k => {
      const txt = s[k].desc;
      const seq = s[k].seq;
      const row = document.createElement("div"); row.className = "ex";
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!d[k];
      const span = document.createElement("span"); span.style.flex = "1";
      span.textContent = `${L[k]}: ${txt}`;
      row.append(cb, span);
      cb.addEventListener("change", () => { d[k] = cb.checked; persistSessions(); renderSessions(); });
      if (seq) {
        const bpmM = txt.match(/(\d+)\s*BPM/i);
        const beatM = txt.match(/(\d+)\s*(bătăi|beats|slag)/i);
        const sb = document.createElement("button"); sb.textContent = T[LANG].show || "Arată";
        sb.addEventListener("click", () => playSequence(seq, bpmM ? +bpmM[1] : null, beatM ? beatM[1] : null));
        const vb = document.createElement("button"); vb.textContent = T[LANG].verify;
        vb.addEventListener("click", () => verifyExercise(seq, vb, () => { d[k] = true; persistSessions(); renderSessions(); }));
        row.append(sb, vb);
      }
      root.appendChild(row);
    });

    const noteRow = document.createElement("div"); noteRow.style.marginTop = "8px";
    const ta = document.createElement("textarea");
    ta.placeholder = L.notePh; ta.value = d.note || ""; ta.rows = 2;
    ta.style.cssText = "width:100%;background:#15161a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px";
    const saveB = document.createElement("button"); saveB.textContent = L.save; saveB.style.marginTop = "6px";
    saveB.addEventListener("click", () => { d.note = ta.value; persistSessions(); });
    noteRow.append(ta, saveB);
    root.appendChild(noteRow);
  });
  persistSessions();
}

/* ---------- RITMUL TAU ----------
   Un ciclu de 8 bătăi: unu, doi, trei, patru, unu, (tăcere), trei, patru.
   Pe fiecare bătaie care are acord, se cântă acordul; altfel, doar metronomul. */
const PATTERN = ["E5", "E5", "E5", "E5", "E5", null, "E5", "E5"];
const PATTERN_BPM = 60;
let patternTimer = null;

function togglePattern() {
  const btn = document.getElementById("patternBtn");
  const info = document.getElementById("patternInfo");
  if (patternTimer) {
    clearInterval(patternTimer); patternTimer = null;
    btn.textContent = "Arată ritmul";
    info.textContent = "";
    return;
  }
  if (metroTimer) toggleMetro();   // metronomul intern nu rulează în paralel
  let i = 0;
  const beatMs = 60000 / PATTERN_BPM;
  const startedAt = Date.now();
  const tickPattern = () => {
    const idx = i % PATTERN.length;
    click(idx === 0);                                   // bătaia 1 e accentuată
    if (PATTERN[idx]) { showChord(PATTERN[idx]); playDemo(PATTERN[idx]); }
    info.textContent = `${idx + 1} / ${PATTERN.length}` + (PATTERN[idx] ? "  ·  cântă " + PATTERN[idx] : "  ·  pauză");
    i++;
    if (Date.now() - startedAt > 60000) togglePattern();   // oprește după 1 minut
  };
  tickPattern();
  patternTimer = setInterval(tickPattern, beatMs);
  btn.textContent = "Oprește";
}
document.getElementById("patternBtn").addEventListener("click", togglePattern);

  title: "title", t_fret: "fret", playChordBtn: "playAnim", demoBtn: "demo", t_fretHelp: "fretHelp",
